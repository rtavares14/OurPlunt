stages:
  - test
  - build
  - deploy

test-frontend:
  stage: test
  image: node:22
  script:
    - cd frontend
    - npm ci
    - npm run test:ci
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**/*

lint-frontend:
  stage: test
  image: node:22
  script:
    - cd frontend
    - npm ci
    - npm run lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      changes:
        - frontend/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**/*

test-backend:
  stage: test
  image: eclipse-temurin:25-jdk
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    - cd backend
    - ./mvnw test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      changes:
        - backend/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/**/*

build-backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:latest backend/
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/backend:latest
  needs: ["test-backend"]
  only:
    refs:
      - main
    changes:
      - backend/**/*

deploy-backend:
  stage: deploy
  image: curlimages/curl
  script:
    - 'curl -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_BACKEND_WEBHOOK_URL"'
  needs: ["build-backend"]
  only:
    refs:
      - main
    changes:
      - backend/**/*

build-landing:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t $CI_REGISTRY_IMAGE/web-landing:latest web_landing/
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/web-landing:latest
  needs: []
  only:
    refs:
      - main
    changes:
      - web_landing/**/*

deploy-landing:
  stage: deploy
  image: curlimages/curl
  script:
    - 'curl -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_LANDING_WEBHOOK_URL"'
  needs: ["build-landing"]
  only:
    refs:
      - main
    changes:
      - web_landing/**/*